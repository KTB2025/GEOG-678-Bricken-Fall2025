<!DOCTYPE html>

<!--
  Highcharts Line Chart with Data Labels demo found at:
https://www.highcharts.com/demo/highcharts/line-labels
  Modified to depict weekly temperature forecast data in College Station.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>College Station Weekly Temperature Forecast by Kate Bricken</title>

  <!-- Load Highcharts -->
  <script src="https://code.highcharts.com/highcharts.js"></script>
</head>
<body>

<div id="container" style="width: 600px; height: 400px; margin: 0 auto;"></div>

<script>
Highcharts.chart('container', {
    chart: {
        type: 'line'
    },
    title: {
        text: 'College Station Weekly Temperature Forecast'
    },
    subtitle: {
        text: 'by Kate Bricken'
    },
    xAxis: {
        categories: ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
        title: {
            text: 'Day of the Week'
        }
    },
    yAxis: {
        title: {
            text: 'Temperature (°F)'
        }
    },
    plotOptions: {
        line: {
            dataLabels: {
                enabled: true
            },
            enableMouseTracking: true
        }
    },
    series: [{
        name: 'Highest (°F)',
        data: [82, 81, 81, 70, 77, 78, 79, 80]
    }, {
        name: 'Lowest (°F)',
        data: [67, 59, 50, 47, 51, 60, 66, 66]
    }]
});
</script>

</body>
</html>
