<!DOCTYPE html>
<html>
  <head>
    <title>Markers with Custom Icons - Bricken</title>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
    
      #map {
        height: 100vh;
      }
    </style>
  </head>
  
  <body>
    <div id="map"></div>
    <script>
      // Initialize the map first
      var map = L.map('map').setView([51.5, -0.09], 13);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
      }).addTo(map);

      // Method 1: Creating a single green icon using L.icon()
      var greenIcon = L.icon({
          iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-green.png',
          shadowUrl: 'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
          iconSize:     [38, 95], // size of the icon
          shadowSize:   [50, 64], // size of the shadow
          iconAnchor:   [22, 94], // point of the icon which will correspond to marker's location
          shadowAnchor: [4, 62],  // the same for the shadow
          popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
      });

      // Add a single marker with the green icon
      L.marker([51.5, -0.09], {icon: greenIcon}).addTo(map).bindPopup("I am a green leaf (single icon method).");

      // Method 2: Defining an icon class (LeafIcon) that extends L.Icon
      var LeafIcon = L.Icon.extend({
          options: {
              shadowUrl: 'https://leafletjs.com/examples/custom-icons/leaf-shadow.png',
              iconSize:     [38, 95],
              shadowSize:   [50, 64],
              iconAnchor:   [22, 94],
              shadowAnchor: [4, 62],
              popupAnchor:  [-3, -76]
          }
      });

      // Create multiple icons from the LeafIcon class
      var greenLeafIcon = new LeafIcon({iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-green.png'}),
          redLeafIcon = new LeafIcon({iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-red.png'}),
          orangeLeafIcon = new LeafIcon({iconUrl: 'https://leafletjs.com/examples/custom-icons/leaf-orange.png'});

      // Add markers using the custom LeafIcon class
      L.marker([51.505, -0.083], {icon: greenLeafIcon}).addTo(map).bindPopup("I am a green leaf (class method).");
      L.marker([51.495, -0.083], {icon: redLeafIcon}).addTo(map).bindPopup("I am a red leaf.");
      L.marker([51.49, -0.1], {icon: orangeLeafIcon}).addTo(map).bindPopup("I am an orange leaf.");

    </script>
  </body>
</html>
