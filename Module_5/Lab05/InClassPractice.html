<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
   integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
   crossorigin=""/>
   <!-- Make sure you put this AFTER Leaflet's CSS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
   integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
   crossorigin=""></script>
   <style>
     #map { height: 400px; }
   </style>
    <title>Leaflet Map - In-Class Practice</title>
  </head>
  <body>
    <h1>Leaflet Map - In-Class Practice</h1>
    <div id="map"></div>
    <script>
        // Setting up the map - initialize map and set view to London coordinates
        var map = L.map('map').setView([51.505, -0.09], 13);
        
        // Add tile layer using OpenStreetMap tiles
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);
        
        // Markers, circles and polygons
        // Add a marker
        var marker = L.marker([51.5, -0.09]).addTo(map);
        
        // Add a circle with custom styling
        var circle = L.circle([51.508, -0.11], {
            color: 'red',
            fillColor: '#f03',
            fillOpacity: 0.5,
            radius: 500
        }).addTo(map);
        
        // Add a polygon
        var polygon = L.polygon([
            [51.509, -0.08],
            [51.503, -0.06],
            [51.51, -0.047]
        ]).addTo(map);
        
        // Working with popups
        marker.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();
        circle.bindPopup("I am a circle.");
        polygon.bindPopup("I am a polygon.");
        
        // Dealing with events - map click handler
        function onMapClick(e) {
            alert("You clicked the map at " + e.latlng);
        }
        
        map.on('click', onMapClick);
        
        // Geolocation functions
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            L.marker(e.latlng).addTo(map)
                .bindPopup("You are within " + radius + " meters from this point").openPopup();

            L.circle(e.latlng, radius).addTo(map);
        }

        function onLocationError(e) {
            alert(e.message);
        }

        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);
      
        // Automatically locate user's position
        // map.locate({setView: true, maxZoom: 16});
    </script>
  </body>
</html>
