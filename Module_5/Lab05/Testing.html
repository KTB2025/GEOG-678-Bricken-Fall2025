<!DOCTYPE html>
<html>
<head>
    <title>Bricken First Web Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        #map {
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    
    <script>
        console.log("Script starting...");
        
        // Initialize the map with Texas A&M as default view
        var map = L.map('map').setView([30.6084, -96.3402], 15);
        console.log("Map initialized");

        // Add OpenStreetMap tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        console.log("Tile layer added");

        // Try to get user location, but don't rely on it
        map.locate({setView: true, maxZoom: 16});

        // Handle successful location detection
        function onLocationFound(e) {
            console.log("Location found:", e.latlng);
            var radius = e.accuracy / 2;

            L.marker(e.latlng).addTo(map)
                .bindPopup("You are within " + radius + " meters from this point").openPopup();

            L.circle(e.latlng, radius).addTo(map);
        }

        // Handle location detection error
        function onLocationError(e) {
            console.log("Location error:", e.message);
            // Map already set to Kyle Field, so just show a message
            alert("Could not detect location. Showing Texas A&M campus.");
        }

        // Event listeners for location
        map.on('locationfound', onLocationFound);
        map.on('locationerror', onLocationError);

        // Draw a circle around Kyle Field with popup
        var kyleFieldCircle = L.circle([30.6084, -96.3402], {
            color: 'maroon',
            fillColor: '#500000',
            fillOpacity: 0.5,
            radius: 200
        }).addTo(map);
        kyleFieldCircle.bindPopup("<b>Kyle Field</b><br>Home of the Texas A&M Aggies!");
        console.log("Kyle Field circle added");

        // Add O&M Building marker with default icon (more reliable)
        var omBuilding = L.marker([30.6179, -96.3386]).addTo(map);
        omBuilding.bindPopup("<b>O&M Building</b><br>Operations & Maintenance<br>Coordinates: [30.6179, -96.3386]");
        console.log("O&M Building marker added");

        // Add Academic Building marker
        var academicBuilding = L.marker([30.6159, -96.3413]).addTo(map);
        academicBuilding.bindPopup("<b>Academic Building</b><br>Texas A&M University<br>Coordinates: [30.6159, -96.3413]");
        console.log("Academic Building marker added");

        // Add click event to show coordinates
        function onMapClick(e) {
            console.log("Map clicked at:", e.latlng);
            L.popup()
                .setLatLng(e.latlng)
                .setContent("Coordinates:<br>Lat: " + e.latlng.lat.toFixed(6) + "<br>Lng: " + e.latlng.lng.toFixed(6))
                .openOn(map);
        }

        map.on('click', onMapClick);
        console.log("Click event listener added");
        
        console.log("Script completed successfully");
    </script>
</body>
</html>
